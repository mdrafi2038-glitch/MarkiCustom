<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Sales Tracker</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><b>📊 Sales Tracker</b></header><main><section id="home" class="page active"><div class="hero"><small>SALES MANAGEMENT</small><h1>Sales Tracker</h1><p>Plan targets, estimate product-wise sales and manage products.</p></div><div class="cards"><button data-go="planning">🎯<span><b>Sales Planning Maker</b><small>Create product-wise target planning</small></span>›</button><button data-go="wise">📊<span><b>Product Wise Sales</b><small>Enter total sales and estimate products</small></span>›</button><button data-go="setup">⚙️<span><b>Product Setup</b><small>Manage products, percentages and prices</small></span>›</button></div></section><section id="planning" class="page"><div class="head"><button data-go="home">‹</button><div><h2>Sales Planning Maker</h2><p>Generate a product-wise target plan.</p></div></div><div class="panel"><label>Total Target (৳)</label><div class="inputrow"><input id="target" type="number" placeholder="e.g. 500000"><button id="generatePlan">Generate</button></div></div><div id="plan"></div></section><section id="wise" class="page"><div class="head"><button data-go="home">‹</button><div><h2>Product Wise Sales</h2><p>Enter only your total sales.</p></div></div><div class="panel"><label>Total Sales (৳)</label><div class="inputrow"><input id="sales" type="number" placeholder="e.g. 15200"><button id="estimate">Estimate</button></div></div><div id="wiseResult"></div></section><section id="setup" class="page"><div class="head"><button data-go="home">‹</button><div><h2>Product Setup</h2><p>These products are used everywhere.</p></div></div><div class="panel"><div class="form"><input id="name" placeholder="Product name"><input id="pct" type="number" placeholder="Sales
